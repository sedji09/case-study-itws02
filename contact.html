    <title>Contact Us</title>
    <script>
        function validateForm(event) {
        event.preventDefault(); 

        const form = event.target;
        const fname = form.fName.value.trim();
        const lname = form.lname.value.trim();
        const email = form.email.value.trim();
        const subject = form.subject.value.trim();
        const message = form.message.value.trim();

            if (!fname || !lname) {
                alert("Please enter both your first and last name");
                return false;
            }
            if (!email) {
                alert("Please enter your email");
                return false;
            }
            if (!subject) {
                alert("Please enter subject");
                return false;
            }

            if (!subject) {
                alert("Please enter your message");
                return false;
            }
            if (confirm("Are you sure you want to submit?")) {
                alert("Successfully Submitted. Thank you for messaging us!");
                form.submit();
            }
            return true;
        }
    </script>
</head>

    <form action="submit_form.php" method="post" class="contact-container" onsubmit="validateForm(event)">
        <section class="contacts-content">

                <legend>Contact Us<legend>

                <div class="input-name container">

                <div class="input-email container">

                <div class="input-phone-no container">

                <div class="input-message container">
                    <textarea name="message" placeholder="How can we help you?" rows="4" cols="10"></textarea>
                </div>
                <div class="action-btn container">
